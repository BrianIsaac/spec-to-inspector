[project]
name = "spec-to-inspector"
version = "0.1.0"
description = "Turns a customer's PCB workmanship specification into a working visual inspector that cites the clause behind every reject."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib[cu130]==2.7.0",
    "docling==2.135.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lightning>=2.6.6",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "rich>=13.5.2",
    "tokenizers>=0.23.2",
    "torch==2.14.1",
    "torchcodec==0.17.0",
    "torchvision==0.29.1",
    "typer>=0.26,<0.27", # docling 2.135.0 caps typer below 0.27
    "uvicorn>=0.54.0",
]

[project.scripts]
spec-to-inspector = "spec_to_inspector.cli:app"

[dependency-groups]
dev = [
    "faster-whisper>=1.2.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "matplotlib>=3.11.2",
    "playwright>=1.63.0",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff==0.16.10",
    "torchmetrics>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_to_inspector"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The laptop's GPU is sm_120 (Blackwell): only the CUDA 13.0 builds carry it.
# Never cu126.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF", "D", "ANN", "S", "PL"]
ignore = [
    "PLR2004", # magic numbers: tests and the published counts compare literals
    "S603",    # subprocess without shell: arguments are built from constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.ruff.lint.pylint]
# Keyword-only parameter lists are counted too; the public functions take theirs by name.
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-m", "not gpu and not data and not live and not bench and not recorded", "--strict-markers"]
markers = [
    "gpu: needs the CUDA GPU (run with -m gpu)",
    "data: needs the fetched VisA data under data/visa (run with -m data)",
    "live: needs the VLM server up and a scored pcb4 run (scripts/serve_vlm.sh start; run with -m live)",
    "bench: needs the data, the trained pcb4 model, the GPU and the VLM server up (run with -m bench)",
    "recorded: needs the trained models and scored runs in the settings' directories (run with -m recorded)",
]
filterwarnings = [
    # Deprecations inside the pinned third-party stack, raised at import or by Anomalib's own calls:
    # kornia calls torch.jit.script under torch 2.14; Anomalib imports timm's and its own old paths.
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Importing from timm.models.layers is deprecated:FutureWarning",
    "ignore:The anomalib.models.components.dinov2 package is deprecated:FutureWarning",
    "ignore:Argument embeddings is deprecated since v2.1.0",
    # FrEIA, an Anomalib dependency, has an unescaped backslash in a docstring; Python says so
    # once, when it first compiles the module in a fresh environment.
    "ignore:invalid escape sequence:SyntaxWarning",
    # Raised only in the gpu-marked runs: Lightning 2.6 on torch 2.14's pytree, and the data
    # loaders' fork() under pytest's threads.
    "ignore:`isinstance\\(treespec, LeafSpec\\)` is deprecated",
    "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\):DeprecationWarning",
]
