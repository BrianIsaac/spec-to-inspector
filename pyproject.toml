[project]
name = "spec-to-inspector"
version = "0.1.0"
description = "Turns a customer's PCB workmanship specification into a working visual inspector that cites the clause behind every reject."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib[cu130]==2.7.0",
    "docling==2.135.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "rich>=13.5.2",
    "torch==2.14.1",
    "torchcodec==0.17.0",
    "torchvision==0.29.1",
    "typer>=0.26,<0.27",  # docling 2.135.0 caps typer below 0.27
]

[project.scripts]
spec-to-inspector = "spec_to_inspector.cli:app"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_to_inspector"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The laptop's GPU is sm_120 (Blackwell): only the CUDA 13.0 builds carry it.
# Never cu126.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF", "D", "ANN", "S", "PL"]
ignore = [
    "PLR2004", # magic numbers: tests and the published counts compare literals
    "S603",    # subprocess without shell: arguments are built from constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not gpu and not data", "--strict-markers"]
markers = [
    "gpu: needs the CUDA GPU (run with -m gpu)",
    "data: needs the fetched VisA data under data/visa (run with -m data)",
]
